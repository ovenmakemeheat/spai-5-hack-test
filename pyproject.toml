[project]
name = "spai-asm1"
version = "0.1.0"
description = "https://www.kaggle.com/competitions/the-ad-ecosystem-and-ctr-prediction/"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch",
    "pandas",
    "matplotlib",
    "numpy",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "scikit-learn>=1.4.0,<1.8.0",
    "lightgbm>=4.6.0",
    "optuna>=4.8.0",
    "xgboost>=3.2.0",
    "autogluon-tabular>=1.5.1b20260421",
    "imbalanced-learn>=0.14.1",
    "nbstripout>=0.9.1",
    "transformers>=5.10.2",
    "accelerate>=1.13.0",
    "fiftyone>=1.16.0",
]


[tool.uv]
default-groups = ["dev", "notebook"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[dependency-groups]
dev = ["ruff>=0.14.13", "ruff-lsp>=0.0.62"]
notebook = [
    "ipykernel",
    "ipywidgets",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.2",
    "nbconvert>=7.16.6",
    "nbqa>=1.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"] # Allow imports not at top of file in notebooks

[tool.nbqa]
addopts = "--ruff"
