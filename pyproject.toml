[project]
name = "spai-asm1"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = []


[tool.uv]
default-groups = ["dev", "notebook"]
environments = ["python_version >= '3.12' and python_version < '3.13'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[dependency-groups]
dev = ["ruff>=0.14.13", "ruff-lsp>=0.0.62"]
notebook = [
    "ipykernel",
    "ipywidgets",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.2,<4.6.0",
    "nbconvert>=7.16.6",
    "nbqa>=1.9.1",
    "nbstripout>=0.9.1",
    "defusedxml>=0.7.1,<0.8.0",
    "sqlalchemy>=2.0,<2.1",
]
common-data = [
    "numpy>=2.0,<2.4",
    "pandas>=2.2,<2.4",
    "matplotlib>=3.9,<3.11",
    "seaborn>=0.13.2",
    "scikit-learn>=1.4.0,<1.8.0",
    "tqdm>=4.67,<5.0",
    "pillow>=11,<13",
]
heart_disease = [
    { include-group = "notebook" },
    { include-group = "common-data" },
    "lightgbm>=4.6.0,<4.7.0",
    "optuna>=4.5.0,<5.0.0",
    "xgboost>=3.0.0,<3.3.0",
    "autogluon-tabular>=1.4.0,<1.5.0",
    "imbalanced-learn>=0.14.1",
    "catboost>=1.2.8,<1.3.0",
]
sleep_stage = [
    { include-group = "notebook" },
    { include-group = "common-data" },
    "torch>=2.7,<2.10",
    "torchvision>=0.22,<0.25",
    "timm>=1.0.0,<1.1.0",
]
chest = [
    { include-group = "notebook" },
    { include-group = "common-data" },
    "torch>=2.7,<2.10",
    "torchvision>=0.22,<0.25",
    "timm>=1.0.0,<1.1.0",
    "medclip",
    "open-clip-torch>=3.0,<4.0",
]
call_center_asr = [
    { include-group = "notebook" },
    { include-group = "common-data" },
    "torch>=2.7,<2.10",
    "torchaudio>=2.7,<2.10",
    "transformers>=5.0.0,<6.0.0",
    "accelerate>=1.0.0,<2.0.0",
    "huggingface-hub>=1.0,<2.0",
    "librosa>=0.11,<0.12",
    "soundfile>=0.13,<0.14",
    "noisereduce>=3.0,<4.0",
    "PyWavelets>=1.8,<2.0",
]
math_vqa = [
    { include-group = "notebook" },
    { include-group = "common-data" },
    "torch>=2.7,<2.10",
    "torchvision>=0.22,<0.25",
    "transformers>=5.0.0,<6.0.0",
    "accelerate>=1.0.0,<2.0.0",
    "qwen-vl-utils>=0.0.14,<0.1.0",
    "opencv-python-headless>=4.12,<5.0",
]
qwen3_inference = [
    { include-group = "notebook" },
    "torch>=2.7,<2.10",
    "transformers>=5.0.0,<6.0.0",
    "accelerate>=1.0.0,<2.0.0",
    "sentencepiece>=0.2,<0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"] # Allow imports not at top of file in notebooks

[tool.nbqa]
addopts = "--ruff"

[tool.spai.chest]
data_root = "dataset/individual-test-chest-disease-detection"
chexfound_root = "src/CheXFound"
image_size = 518
resize_size = 518
batch_size = 2
n_last_blocks = 4
glori_decoder_dim = 768
timm_token_backbone = "vit_giant_patch14_dinov2.lvd142m"
timm_token_backbones = [
    "vit_giant_patch14_dinov2.lvd142m",
    "vit_large_patch14_dinov2.lvd142m",
    "vit_base_patch14_dinov2.lvd142m",
    "vit_large_patch16_384.augreg_in21k_ft_in1k",
    "vit_large_patch16_224.augreg_in21k_ft_in1k",
    "vit_base_patch16_224.dino",
]
# Optional native CheXFound checkpoint paths. Environment variables still override these.
# chexfound_config = "path/to/config.yaml"
# chexfound_weights = "path/to/teacher_checkpoint.pth"
